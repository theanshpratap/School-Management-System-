{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Edit Student</h1>
        <form method="post">
            {% csrf_token %}
            <table class="table table-bordered">
                <tr>
                    <td>Student Roll No</td>
                    <td>
                        <input type="text" name="rollno" value="{{st.rollno}}" class="form-control" readonly>
                    </td>
                </tr>
                <tr>
                    <td>Student Name</td>
                    <td>
                        <input type="text" name="name" value="{{st.name}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Father's Name</td>
                    <td>
                        <input type="text" name="fname" value="{{st.fname}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Mother's Name</td>
                    <td>
                        <input type="text" name="mname" value="{{st.mname}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="text" name="gender" value="{{st.gender}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Date of Birth</td>
                    <td>
                        <input type="text" name="dob" value="{{st.dob}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Contact No</td>
                    <td>
                        <input type="text" name="contactno" value="{{st.contactno}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Alternate No</td>
                    <td>
                        <input type="text" name="altrnum" value="{{st.altrnum}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Email Address</td>
                    <td>
                        <input type="email" name="emailaddress" value="{{st.emailaddress}}" class="form-control">

                    </td>
                </tr>

                <tr>
                    <td>Student Class</td>
                    <td>

                        <input type="text" name="sclass" value="{{st.sclass}}" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Address</td>
                    <td>
                        <textarea name="address" class="form-control">{{st.address}}</textarea>
                    </td>
                </tr>
                <tr>
                    <td>Paid Fee</td>
                    <td>
                        <input type="text" name="feepaid" class="form-control" value="{{st.feepaid}}">
                    </td>
                </tr>
                <tr>
                    <td>Due Fee</td>
                    <td>
                        <input type="text" name="duefees" class="form-control" value="{{st.duefees}}">
                    </td>
                </tr>


                <tr>
                    <td colspan="2" class="text-center">
                        <button type="submit" class="btn btn-success">Update</button>
                    </td>
                </tr>

            </table>
        </form>
    </div>
</div>


{% endblock %}
