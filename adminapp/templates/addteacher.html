{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Add Teacher</h1>
        <form method="post">
            {% csrf_token %}
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <td>Enter Name</td>
                        <td>
                            <input type="text" name="name" class="form-control" placeholder="Enter name">
                        </td>
                    </tr>
                    <tr>
                        <td>Father's Name</td>
                        <td>
                            <input type="text" name="fname" class="form-control" placeholder="Enter Father's name">
                        </td>
                    </tr>
                    <tr>
                        <td>Mother's Name</td>
                        <td>
                            <input type="text" name="mname" class="form-control" placeholder="Enter Mother's name">
                        </td>
                    </tr>
                    <tr>
                        <td>Select Gender</td>
                        <td>
                            <input type="radio" name="gender" value="Male" class="form-check-input">Male
                            <input type="radio" name="gender" value="Female" class="form-check-input">Female
                        </td>
                    </tr>
                    <tr>
                        <td>Date Of Birth</td>
                        <td>
                            <input type="date" name="dob" class="form-control" >
                        </td>
                    </tr>
                    <tr>
                        <td>Contact No</td>
                        <td>
                            <input type="number" name="contactno" class="form-control" >
                        </td>
                    </tr>
                    <tr>
                        <td>Email Address</td>
                        <td>
                            <input type="email" name="emailaddress" class="form-control" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Select Class</td>
                        <td>
                          <select name="tclass" class="form-control">
                            <option value="">---Select Class of Teacher--</option>

                            {% for c in cl %}
                            <option value="{{c.class_name}}">{{c.class_name}}</option>

                            {% endfor %}
                          </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Address</td>
                        <td>
                            <textarea name="address" class="form-control">{{c.address}}</textarea>
                        </td>
                    </tr>
                    <tr>
                        <td>Salary</td>
                        <td>
                            <input type="number" name="salary" class="form-control">
                        </td>
                    </tr>
                    <tr>
                        <td>Highest Qualification</td>
                        <td>
                            <input type="text" name="qualification" class="form-control">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="text-center">
                            <button type="submit" class="btn btn-primary">Add</button>
                        </td>
                    </tr>
                    
                </thead>


            </table>
        </form>
    </div>
</div>

{% endblock %}
