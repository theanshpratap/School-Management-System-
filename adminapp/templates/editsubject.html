{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<div class="row">
    <div class="col-sm-6 mx-auto">
        <h1 class="text-center">Edit Subject</h1>
        <form method="post">
            {% csrf_token %}
            <table class="table table-bordered">
                <tr>
                    <td>Subject Id</td>
                    <td>
                        <input type="text" name="sid" value="{{sub.sid}}" class="form-control" readonly>
                    </td>
                </tr>
                <tr>
                    <td>Subject Name</td>
                    <td>
                        <input type="text" name="subject_name" value="{{sub.subject_name}}" class="form-control">

                    </td>
                </tr>
                <tr>
                    <td>Select Class</td>
                    <td>

                        <input type="text" name="sclass" value="{{sub.sclass}}" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Book Name</td>
                    <td>
                        <input type="text" name="book" value="{{sub.book}}" class="form-control">

                    </td>

                </tr>
                <tr>
                    <td>Subject Teacher</td>
                    <td>
                        <input type="text" name="steacher" value="{{sub.steacher}}" class="form-control">

                    </td>

                </tr>
                <tr>
                    <td colspan="2" class="text-center">
                        <button type="submit" class="btn btn-success">Update</button>
                    </td>
                </tr>

            </table>
        </form>

    </div>
</div>


{% endblock %}
