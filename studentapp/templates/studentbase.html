{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
    <link rel="stylesheet" href="{% static 'css/adminstyle.css' %}">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css"> -->
    <script src="https://kit.fontawesome.com/ae360af17e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <style>
         .sz{
            font-size: 35px;
            text-align: center;
            font-weight: bolder;
            background-color: aquamarine;
            color: black;
            padding: 5px;
            font-family: "Ubuntu", sans-serif;
        }
        .navbr li a{
            font-family: "Ubuntu", sans-serif;
            font-weight: 600;
        }
        .navbr li a:hover{
           color: aquamarine;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <aside id="sidebar" class="js-sidebar">
            <!-- Content For Sidebar -->
            <div class="h-100 ">
                <div class="sidebar-logo p-0 text-center">
                    <p class="m-0"> <img src="{% static 'images/student.png' %}" alt="" style="height: 100px;"></p>
                   <p class="sz">Student Zone</p>
                </div>
                <hr class="text-white">
                <ul class="sidebar-nav navbr">
                    <li class="sidebar-header text-decoration-none">
                        Student Elements
                    </li>
                    <hr class="text-white">
                    <li class="sidebar-item">
                        <a href="{% url 'studentapp:studenthome' %}" class="sidebar-link text-decoration-none">
                            <i class="fa-solid fa-chart-line pe-2"></i>
                            Dashboard
                        </a>
                    </li>
                    <hr class="text-white">
                    <li class="sidebar-item">
                        <a href="{% url 'studentapp:stuattend' %}" class="sidebar-link text-decoration-none">
                            <i class="fa-solid fa-list pe-2"></i>
                            View Attendance
                        </a>
                    </li>
                    <hr class="text-white">
                    <li class="sidebar-item">
                        <a href="{% url 'studentapp:stuslm' %}" class="sidebar-link text-decoration-none">
                            <i class="fa-solid fa-book pe-2"></i>
                            View SLM
                        </a>
                    </li>
                    <hr class="text-white">
                    <li class="sidebar-item">
                        <a href="{% url 'studentapp:studentprofile' %}" class="sidebar-link text-decoration-none">
                            <i class="fa-solid fa-address-card pe-2"></i>
                          Update Profile
                        </a>
                    </li>
                    <hr class="text-white">
                    <li class="sidebar-item">
                        <a href="{% url 'studentapp:schangepass' %}" class="sidebar-link text-decoration-none">
                            <i class="fa-solid fa-lock pe-2"></i>
                          Change Password
                        </a>
                    </li>
                    <hr class="text-white">
                    <li class="sidebar-item text-center">
                        <a href="{% url 'studentapp:studentlogout' %}" class="sidebar-link text-decoration-none">
                            <i class="fa-solid fa-right-from-bracket pe-2"></i>
                          Logout
                        </a>
                    </li>
                   
                   
                </ul>
            </div>
        </aside>
        <div class="main">
            <nav class="navbar navbar-expand px-3 border-bottom">
                <button class="btn" id="sidebar-toggle" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse navbar">
                    <ul class="navbar-nav navbr">
                        <li class="nav-item dropdown">
                            <a href="#" data-bs-toggle="dropdown" class="nav-icon pe-md-0 text-decoration-none">
                                <span class="me-2 text-success">{{student.name}}</span>
                                <i class="fa-regular fa-circle-user"></i>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end">
                                <a href="{% url 'studentapp:studentprofile' %}" class="dropdown-item"><i class="fa-solid fa-address-card pe-2"></i>Profile</a>
                                <a href="{% url 'studentapp:studentlogout' %}" class="dropdown-item"><i class="fa-solid fa-right-from-bracket pe-2"></i>Logout</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
            <main class="content px-3 py-2">
                <div class="container-fluid">
                    {% block student %}


                    {% endblock %}
                </div>
            </main>
            <a href="#" class="theme-toggle">
                <i class="fa-regular fa-moon"></i>
                <i class="fa-regular fa-sun"></i>
            </a>
            <footer class="footer">
                <div class="container-fluid">
                    <div class="row text-muted">
                        <div class="col-12 text-end">
                            <p class="mb-0">
                                <a href="#" class="text-muted text-decoration-none">
                                    <strong>&copy;Ansh Pratap 2024</strong>
                                </a>
                            </p>
                        </div>
                        
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/js/bootstrap.bundle.min.js"></script> -->
    <script src="{% static 'js/adminjs.js' %}"></script>

</body>

</html>
