{% extends 'studentbase.html' %}
{% load static %}
{% block student %}


<div class="row">
    <div class="col-sm-12">
        <h1 class="py-4"> Student Profile</h1>
    </div>


    <form method="post" action="{% url 'studentapp:uploadpic' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row">
            <div class="col-sm-2">
                {% if student.pic %}
                <img src="{{student.pic.url}}" alt="" class="img-fluid border" height="250" width="250" >
                {% endif %}
                <input type="file" name="pic" required>
                <input type="submit" value="Upload" class="btn btn-primary text-center" required>
            </div>
        </div>
    </form>
    <form method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6">
                <label for="si" class="form-label">Student ID</label>
                <input type="text" name="id" value="{{student.id}}" id="si" class="form-control border-0" readonly>
            </div>
            <div class="col-md-6">
                <label for="rn" class="form-label">Student Roll No</label>
                <input type="text" name="rollno" value="{{student.rollno}}" id="rn" class="form-control border-0" readonly>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <label for="n" class="form-label">Name</label>
                <input type="text" name="name" value="{{student.name}}" id="n" class="form-control border-0" readonly>
            </div>
            <div class="col-md-6">
                <label for="fn" class="form-label">Father's Name</label>
                <input type="text" name="fname" value="{{student.fname}}" id="fn" class="form-control border-0" readonly>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <label for="mn" class="form-label">Mother's Name</label>
                <input type="text" name="mname" value="{{student.mname}}" id="mn" class="form-control border-0"readonly>
            </div>
            <div class="col-md-6">
                <label for="g" class="form-label">Gender</label>
                <input type="text" name="gender" value="{{student.gender}}" id="g" class="form-control border-0"readonly>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" name="dob" value="{{student.dob}}" id="dob" class="form-control border-0"readonly>
            </div>
            <div class="col-md-6">
                <label for="cn" class="form-label">Contact No</label>
                <input type="number" name="contactno" value="{{student.contactno}}" id="cn"
                    class="form-control border-0"readonly>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <label for="atnum" class="form-label">Alternate No</label>
                <input type="number" name="altrnum" value="{{student.altrnum}}" id="atnum"
                    class="form-control border-0" readonly>
            </div>
            <div class="col-md-6">
                <label for="em" class="form-label">Email Address</label>
                <input type="email" name="emailaddress" value="{{student.emailaddress}}" id="em"
                    class="form-control border-0" readonly>
            </div>
          
        </div>

        
        <div class="row mt-3">

            <div class="col-md-6">
                <label for="pd" class="form-label">Paid Fee</label>
                <input type="text" name="feepaid" value="{{student.feepaid}}" id="pd" class="form-control border-0"
                    readonly>
            </div>
            <div class="col-md-6">
                <label for="df" class="form-label">Due Fee</label>
                <input type="text" name="duefees" value="{{student.duefees}}" id="df" class="form-control border-0"
                    readonly>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">

                <label for="ad" class="form-label">Address</label>
                <textarea name="address" id="ad" class="form-control border-0" readonly>{{student.address}}</textarea>

            </div>
            <div class="col-md-6">
                <label for="cl" class="form-label">Student Class</label>
                <input type="text" name="sclass" value="{{student.sclass}}" id="cl" class="form-control border-0"
                    readonly>
            </div>
        </div>
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">Update</button>

        </div>
    </form>

</div>

{% endblock %}
